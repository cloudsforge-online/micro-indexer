# CloudsForge deposit observation. Observation and broadcast ONLY: this node never mines,
# never produces a block, and holds no wallet.
datadir=/data/chains/bitcoin
server=1
rpcport=50001
# Loopback only for now. The indexer container gets an explicit allow when it is wired up.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# No inbound: ingress is a Cloudflare Tunnel and this host has no reachable port. Outbound-dialled
# peers sync perfectly well; advertising an address we cannot serve would be a lie to the network.
listen=0
# Transaction relay off during catch-up. A deposit is credited at a confirmation depth and never at
# zero, so the mempool buys this service nothing and costs bandwidth and CPU it has to share with
# the EMBER miner. Our own sendrawtransaction still relays.
blocksonly=1
# txindex is NOT needed: getblock verbosity 3 resolves prevouts from the undo files, which an
# unpruned node always has. The existing 17G index is left on disk untouched, merely not maintained.
txindex=0
prune=0
dbcache=450
# Two of four threads. The other two stay for the EMBER miner, whose block production is
# load-bearing for Hearth security and outranks this catch-up entirely.
par=1
maxconnections=20
