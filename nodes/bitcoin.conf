# CloudsForge deposit observation. Observation and broadcast ONLY: this node never mines,
# never produces a block, and holds no wallet.
#
# THIS FILE IS THE ONE RUNNING. Every value below was read back off the daemon on the chain host
# on 2026-08-11 and agrees line for line with /data/chains/bitcoin/bitcoin.conf there; the only
# line that differs is the `rpcauth` placeholder at the end, which carries no credential here.
# It did not always agree. Until this commit the committed copy said `txindex=0`, `dbcache=450`,
# `par=1` and "loopback only", none of which had been true since the node finished catching up —
# and micro-org#373 read it as ground truth and drew a conclusion from it. If you change the
# daemon, change this in the same hour; a config file that is trusted and wrong is worse than one
# nobody reads.
datadir=/data/chains/bitcoin
server=1
rpcport=50001
# The bind list is assembled in THREE places in this file, not one: loopback here, the two docker
# bridge gateways below, and the WireGuard address at the end. They are deliberately kept apart
# and all three are deliberately kept, so undoing the most recent move needs no edit here. See
# `README.md` for why the answer is never 0.0.0.0.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# No inbound: ingress is a Cloudflare Tunnel and this host has no reachable port. Outbound-dialled
# peers sync perfectly well; advertising an address we cannot serve would be a lie to the network.
listen=0
# Transaction relay off. A deposit is credited at a confirmation depth and never at zero, so the
# mempool buys this service nothing and costs bandwidth and CPU it has to share with the EMBER
# miner, which still runs on this host. Our own sendrawtransaction still relays.
blocksonly=1
# ON, and the committed copy of this file claimed the opposite for weeks.
#
# What it costs: about 17 GB. It is synced to tip (961,930 as of 2026-08-11).
#
# What consumes it: `#prevouts` in `src/bitcoin.ts` asks `getrawtransaction(txid, true)` with no
# block hash for every prevout that `getblock` verbosity 3 did not carry, and Core answers that
# for a historical transaction only when this index exists. On Core 27 verbosity 3 does carry
# them, so that path is a FALLBACK and is not on the hot path today — which is exactly why the
# setting is easy to get wrong from the code alone. With the index off the fallback degrades
# quietly: inputs land in `unresolvedInputs`, deposits are unaffected because a deposit is an
# output, and outbound movement attribution goes incomplete without anything failing.
#
# So: this is not free and it is not load-bearing today. It is declared here because the index is
# already built, and maintaining it is cheaper than the day something needs it and does not have it.
txindex=1
prune=0
# 3 GB of UTXO cache on a box with 15 GB total that also runs litecoind, dogecoind and the EMBER
# miner. Sized for initial block download, which finished — as of 2026-08-11 the node is at tip
# with `initialblockdownload: false`, so this is now buying very little and could come down. It is
# left alone because lowering it costs a restart and a chainstate flush for no measured gain; if
# this host ever comes under memory pressure, this is the first number to cut.
dbcache=3000
# 0 means "one script-verification thread per core" — all four here, NOT the two the committed
# copy of this file used to claim. That claim came from catch-up, when script verification ran
# flat out for days and the EMBER miner had to be left room. Catch-up is over: at tip this node
# verifies one block roughly every ten minutes, so the setting no longer contends with anything.
par=0
maxconnections=20
# BIP157/158 compact filters, served to our own light client so `btcdiff.ts` can check that client
# against a node that validated every block itself. Still BUILDING as of 2026-08-11 — 918,038 of
# 961,930, moving at about 280 blocks a minute, so roughly three hours out. Until it reaches tip
# the oracle comparison can only run below its height, which is a limit on the check and not on
# deposits.
blockfilterindex=1
# THE BLAST RADIUS, made a guarantee rather than a coincidence. Every container that can reach the
# app host can reach this RPC. With no wallet loaded there are no keys and no `sendtoaddress`, so
# the reachable surface is reading chain data and relaying a transaction signed somewhere else.
# `custody` holds every private key and always will. See `README.md`.
disablewallet=1

rpcbind=172.20.0.1
rpcbind=172.31.0.1
rpcallowip=172.20.0.0/16
rpcallowip=172.31.0.0/16

# Peers added by hand after measuring the cause of a slow IBD: Core caps AUTOMATIC
# outbound connections at 10 (8 full-relay + 2 block-relay), which is compile-time and
# unaffected by maxconnections. At 10 peers this node pulled 0.445 MiB/s on a link that
# tests at 6-11 MB/s. These get slots BEYOND that cap; adding them took the block rate
# from 17/min to 39/min. addnode at runtime does not survive a restart -- hence here.
# They have done their job — the node reached tip on 2026-08-10 — and are kept because a
# reorg-and-catch-up wants the same slots and nobody will remember to add them again.
addnode=13.61.77.103
addnode=149.107.35.176
addnode=176.74.136.237
addnode=139.68.231.75
addnode=194.50.122.11
addnode=88.99.174.220

# 2026-08-09: litecoind on this host wedged with the default 4 threads / 16-slot work queue,
# rejecting every RPC for ~20 minutes while all workers sat idle and no connection was open
# (micro-org#307). Set here too, before anything depends on this node, rather than after.
rpcthreads=8
rpcworkqueue=64

# --- micro-org#338 ---------------------------------------------------------------------------
# The application stack moved to a second machine on 2026-08-10 (WSL2 on 192.168.1.129). The
# 172.20.0.1 bind above is the estate docker bridge gateway, and that bridge leaves with the app,
# so the address the app now arrives on is the WireGuard interface built for this split. Bitcoin
# RPC is HTTP Basic over plain HTTP with no TLS option, so the alternative was the credential in
# base64 on the LAN on every poll. A /32, never a /24: exactly one host may speak to this node.
# The 127.0.0.1 and 172.x lines above are kept on purpose so a rollback needs no edit here.
rpcbind=10.10.0.1
rpcallowip=10.10.0.2/32

# The real value is generated on the host and lives in a 0600 file. Never commit a credential.
rpcauth=cfindexer:<salt>$<hmac-sha256-of-password>
