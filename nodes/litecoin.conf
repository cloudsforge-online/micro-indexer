# CloudsForge deposit observation, broadcast, AND the pool's block templates. No wallet.
#
# The "observation and broadcast ONLY" this header used to claim stopped being true when micro-pool
# started asking this node for `getblocktemplate`, and the stale sentence is what let `blocksonly=1`
# survive below for two days without anyone asking what it did to a template.
#
# THIS FILE IS THE ONE RUNNING — read back off the daemon on the chain host on 2026-08-11, and
# the two `rpcauth` placeholders at the end are the only lines that differ from it. Until this commit
# the committed copy said `txindex=0`, `dbcache=700`, `par=1`, `maxconnections=16` and had neither
# the work-queue block nor the WireGuard bind. It had been wrong since 2026-08-09. LTC is the one
# chain this estate credits deposits on today, so this is the file least safe to guess at.
datadir=/data/chains/litecoin
server=1
rpcport=50002
listen=0
# blocksonly WAS 1 here until 2026-08-11, and micro-pool is why it is not.
#
# Under blocksonly this node accepts no unconfirmed transactions from peers at all, so
# `getmempoolinfo` reported size 0 for ever and every template `getblocktemplate` handed micro-pool
# was empty — measured in this node's own debug log as
# `CreateNewBlock(): block weight: 1188 txs: 0 fees: 0`. A pool that found a block would have
# collected the subsidy and NOT ONE SATOSHI of fees, and nothing would have looked wrong anywhere:
# the block is valid, the share accounting is right, the miners are paid. It just quietly earns
# less. The same log after the flip, same node, same hour:
# `CreateNewBlock(): block weight: 205817 txs: 237 fees: 382472`.
#
# It also silently disabled the one escape a longpoll has. `getblocktemplate` with a `longpollid`
# blocks an RPC worker until either the tip moves or `mempool.GetTransactionsUpdated()` changes —
# and with a permanently empty mempool the second can never happen, so the wait is unbounded
# between blocks. That is the mechanism behind micro-org#307 and micro-org#376.
#
# The cost is a mempool. `maxmempool` below bounds it, and this node is at tip on a box with ~6 GB
# available. The blocksonly argument in the README is about BITCOIND, where nothing builds
# templates, and it still holds there. micro-org#377.
blocksonly=0
# Explicit rather than left to the 300 MB default, on a host that also runs bitcoind and dogecoind.
# Litecoin's real mempool is a few MB — 212 transactions in 46 kB five minutes after the restart —
# so this is headroom, not an allocation.
maxmempool=200
# ON — the committed copy of this file said `0` and the README still argues the case for `0`. That
# argument is about Bitcoin and is sound for Bitcoin. It does NOT carry over, and the reason is
# worth knowing because it is invisible from the logs.
#
# Litecoin Core 0.21.x predates `getblock` verbosity 3 (Bitcoin Core 25). It does not reject it:
# measured against this node on 2026-08-11, `getblock <hash> 3` answers 200 with verbosity-2
# shaped data and ZERO `prevout` keys. `#blockByHash` in `src/bitcoin.ts` probes by asking for 3
# and latching success on `hash` and `tx` being present, so on this chain it latches TRUE, the
# "node does not serve verbosity 3" line never prints, and every block quietly takes the
# `getrawtransaction` path anyway. The fallback is not occasional here — it is the only path.
#
# Core answers `getrawtransaction(txid, true)` with no block hash for a historical transaction
# only when this index exists. With `txindex=0` every one of those calls returns -5 and
# `unresolvedInputs` fills up on the ONE chain this estate actually moves money on, with nothing
# failing and no error anywhere. That is the whole case. (Same story on dogecoind 1.14.9, measured
# the same way — see `dogecoin.conf`.)
txindex=1
prune=0
# Kept, and deliberately. Litecoin Core builds BIP157 compact filters by default and this index is
# ALREADY built to height 2,825,551. It is what lets our own node serve compact filters to our own
# light client, which is how the light client gets validated block-for-block against ground truth.
# Synced to tip as of 2026-08-11 (3,157,723), unlike bitcoind's, which is still building.
blockfilterindex=1
peerblockfilters=1
# Raised from 700 during catch-up. The node has been at tip since 2026-08-10
# (`initialblockdownload: false`), so like bitcoind's 3000 this is now mostly idle memory on a
# 15 GB box; both are candidates to cut before anything else if this host runs short.
dbcache=2500
# 3 of 4 script-verification threads, NOT the one the committed copy claimed. The claim was a
# catch-up allocation — bitcoind was told to take two and the EMBER miner the rest — and every
# part of that is over: bitcoind reached tip, and at tip a chain verifies one block every couple
# of minutes, so this contends with the miner for seconds a day rather than continuously.
par=3
maxconnections=32

# --- RPC reachability for the indexer container (#215) ---
# The daemon runs on the host; the indexer runs in a container, so loopback alone means the
# seam has nothing to talk to. Binding to 0.0.0.0 on a box that also serves public traffic
# through a Cloudflare Tunnel is the wrong trade, so the bind is scoped to the two Docker
# bridge gateways that the indexer replicas actually sit behind. Those addresses are
# host-local: they are not routable from the LAN and the tunnel forwards to named service
# ports, never to these.
rpcbind=127.0.0.1
rpcbind=172.20.0.1
rpcbind=172.31.0.1
rpcallowip=127.0.0.1
rpcallowip=172.20.0.0/16
rpcallowip=172.31.0.0/16

# THE BLAST RADIUS, made a guarantee rather than a coincidence.
# Any container on those two networks can reach this RPC, not only the indexer — that is
# roughly ninety containers. With no wallet loaded there are no keys to use and no
# sendtoaddress to call, so the reachable surface is reading chain data and relaying a
# transaction that was signed somewhere else. custody holds the keys and always will.
disablewallet=1

# 2026-08-09: the default 4 threads / 16-slot work queue wedged with all workers idle and
# zero connections open, rejecting every request as "work queue depth exceeded" for ~15 minutes.
# Raised so a burst cannot fill it, on a host that also runs bitcoind and dogecoind IBD.
rpcthreads=8
rpcworkqueue=64

# --- micro-org#338 ---------------------------------------------------------------------------
# The application stack moved to a second machine on 2026-08-10 (WSL2 on 192.168.1.129). The
# 172.20.0.1 bind above is the estate docker bridge gateway, and that bridge leaves with the app,
# so the address the app now arrives on is the WireGuard interface built for this split. Litecoin
# RPC is HTTP Basic over plain HTTP with no TLS option, so the alternative was the credential in
# base64 on the LAN on every poll. A /32, never a /24: exactly one host may speak to this node.
# The 127.0.0.1 and 172.x lines above are kept on purpose so a rollback needs no edit here.
rpcbind=10.10.0.1
rpcallowip=10.10.0.2/32

# TWO users on this daemon, and only this daemon. Do not read that as one credential per service —
# measured off the running containers on 2026-08-11, it is not:
#
#   cfindexer2   INDEXER_RPC_LTC_MAINNET (micro-indexer) *and* SETTLEMENT_RPC_URLS (micro-settlement)
#   cfindexer    nothing on this chain. The indexer's BTC_RPC_URL uses that name against BITCOIND.
#
# So the two services that read and broadcast LTC share one credential, and the first user here is
# residue from before the second was added. Two consequences worth knowing before you touch it:
# rotating this credential takes down deposit observation and withdrawal broadcast together, and
# the daemon's access log cannot tell you which of them made a call. bitcoind and dogecoind have
# one user each because nothing broadcasts on them yet.
#
# The real values are generated on the host and live in a 0600 file. Never commit a credential.
rpcauth=cfindexer:<salt>$<hmac-sha256-of-password>
rpcauth=cfindexer2:<salt>$<hmac-sha256-of-password>
