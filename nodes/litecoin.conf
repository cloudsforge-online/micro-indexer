# CloudsForge deposit observation. Observation and broadcast ONLY: never mines, no wallet.
datadir=/data/chains/litecoin
server=1
rpcport=50002
listen=0
blocksonly=1
txindex=0
prune=0
# Kept, and deliberately. Litecoin Core builds BIP157 compact filters by default and this index is
# ALREADY built to height 2,825,551. It is what lets our own node serve compact filters to our own
# light client, which is how the light client gets validated block-for-block against ground truth.
blockfilterindex=1
peerblockfilters=1
dbcache=700
# One thread. Bitcoin already holds two and the EMBER miner outranks both.
par=1
maxconnections=16

# --- RPC reachability for the indexer container (#215) ---
# The daemon runs on the host; the indexer runs in a container, so loopback alone means the
# seam has nothing to talk to. Binding to 0.0.0.0 on a box that also serves public traffic
# through a Cloudflare Tunnel is the wrong trade, so the bind is scoped to the two Docker
# bridge gateways that the indexer replicas actually sit behind. Those addresses are
# host-local: they are not routable from the LAN and the tunnel forwards to named service
# ports, never to these.
rpcbind=127.0.0.1
rpcbind=172.20.0.1
rpcbind=172.31.0.1
rpcallowip=127.0.0.1
rpcallowip=172.20.0.0/16
rpcallowip=172.31.0.0/16

# THE BLAST RADIUS, made a guarantee rather than a coincidence.
# Any container on those two networks can reach this RPC, not only the indexer — that is
# roughly ninety containers. With no wallet loaded there are no keys to use and no
# sendtoaddress to call, so the reachable surface is reading chain data and relaying a
# transaction that was signed somewhere else. custody holds the keys and always will.
disablewallet=1


# The real value is generated on the host and lives in a 0600 file. Never commit a credential.
rpcauth=cfindexer:<salt>$<hmac-sha256-of-password>
