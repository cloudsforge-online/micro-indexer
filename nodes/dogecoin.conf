# CloudsForge deposit observation and merge-mined block submission.
#
# THIS FILE WAS MISSING. dogecoind has run on the chain host since 2026-08-09 and this directory
# committed configs for two of the three daemons, so the one node whose posture differs from the
# other two — see `disablewallet` below — was the one nobody could read. Added by micro-org#373
# item 8 together with the corrections to `bitcoin.conf` and `litecoin.conf`.
#
# Read back off the daemon on 2026-08-11; the `rpcauth` placeholder at the end is the only line
# that differs from /data/chains/dogecoin/dogecoin.conf there.
#
# There is no `datadir=` line, deliberately: this daemon is started with `-datadir=` on the command
# line, which is also why every `dogecoin-cli` call against it needs `-datadir` AND `-rpcport`.
rpcport=9332
server=1
# Loopback plus the two docker bridges the indexer reaches us on -- same pattern as
# bitcoin.conf and litecoin.conf. The old 0.0.0.0 was silently accepted by the previous
# build and is rejected outright by 1.14.9, which is why this node would not start.
rpcbind=127.0.0.1
rpcbind=172.20.0.1
rpcbind=172.31.0.1
rpcallowip=127.0.0.1
rpcallowip=172.20.0.0/16
rpcallowip=172.31.0.0/16
# 0 — AND THIS IS THE ONE LINE IN THIS DIRECTORY THAT CONTRADICTS `README.md`.
#
# `bitcoin.conf` and `litecoin.conf` both set `disablewallet=1`, and the README calls that the
# setting "that bounds the blast radius of everything else". This node does not have it. Measured
# on 2026-08-11: a wallet IS loaded, `getbalance` is 0.00000000, `txcount` is 0, and the keypool
# dates from 2025-01-10, so it is an inherited wallet holding nothing rather than one this estate
# funded. `custody` still holds every key that matters and this node holds none of them.
#
# It is recorded rather than flipped because flipping it is a restart and wants a check first. The
# obvious suspect — merge mining — does not appear to need it: `auxtemplate.ts` calls
# `createauxblock(payoutAddress)` with the pool's own address as an argument, not the wallet-backed
# `getauxblock()`. But that is read from the code, not proved against a wallet-less daemon, and
# this node is mid-IBD where `submitauxblock` answers -10 to everything anyway. Tracked separately;
# do not assume from this comment that turning it off is safe until somebody has watched
# `createauxblock` answer on a daemon with `disablewallet=1`.
disablewallet=0
# The existing database was built WITH the transaction index (LoadBlockIndexDB reports
# "transaction index enabled"). Declaring it here matches the database on disk; omitting it
# makes 1.14.9 demand a full -reindex of 117GB to drop an index we want to keep anyway.
#
# It is also load-bearing for the same reason it is on litecoind: 1.14.9 accepts `getblock <hash> 3`
# and answers verbosity-2 data with ZERO `prevout` keys (measured, 2026-08-11), so `#prevouts` in
# `src/bitcoin.ts` resolves every input through `getrawtransaction(txid, true)`, which needs this.
txindex=1

# Peers added by hand. This node sat at 2-4 connections and 3.5 blocks/min against a

# 1.32M block backlog -- 267 days at that rate. The DNS seeds hand back mostly dead

# hosts (Connection refused / No route to host fill the log), and Core caps AUTOMATIC

# outbound at 8 regardless of maxconnections. addnode entries get slots beyond that

# cap, which is the same fix that took Bitcoin from 17 to 39 blocks/min.
addnode=104.248.81.232
addnode=146.135.1.140
addnode=159.198.64.235
addnode=160.202.131.115
addnode=161.97.146.8
addnode=178.63.101.57
addnode=185.209.70.39
addnode=185.55.241.233
addnode=35.72.111.38
addnode=44.211.20.218

# 2026-08-09: litecoind on this host wedged with the default 4 threads / 16-slot work queue,
# rejecting every RPC for ~20 minutes while all workers sat idle and no connection was open
# (micro-org#307). Set here too, before anything depends on this node, rather than after.
rpcthreads=8
rpcworkqueue=64

# --- micro-org#338 ---------------------------------------------------------------------------
# The application stack moved to a second machine on 2026-08-10 (WSL2 on 192.168.1.129). The
# 172.20.0.1 bind above is the estate docker bridge gateway, and that bridge leaves with the app,
# so the address the app now arrives on is the WireGuard interface built for this split. Dogecoin
# RPC is HTTP Basic over plain HTTP with no TLS option, so the alternative was the credential in
# base64 on the LAN on every poll. A /32, never a /24: exactly one host may speak to this node.
# The 127.0.0.1 and 172.x lines above are kept on purpose so a rollback needs no edit here.
rpcbind=10.10.0.1
rpcallowip=10.10.0.2/32

# The real value is generated on the host and lives in a 0600 file. Never commit a credential.
rpcauth=cfindexer:<salt>$<hmac-sha256-of-password>
